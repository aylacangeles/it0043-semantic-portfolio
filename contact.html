<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayla Angeles | Contact</title>
</head>

<body>
    <header>
        <h1>Contact Me</h1>
        <p>Use the form below to send me a message.</p>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Skills</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Send a Message</h2>

            <article>
                <h3>Contact Form</h3>

                <form action="#" method="post">
                    <div>
                        <label for="full-name">Full Name</label>
                        <input
                            type="text"
                            id="full-name"
                            name="full-name"
                            required
                        >
                    </div>

                    <div>
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </div>

                    <div>
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                        >
                    </div>

                    <div>
                        <label for="subject">Subject</label>
                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                        >
                    </div>

                    <div>
                        <label for="message">Message</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                        ></textarea>
                    </div>

                    <button type="submit">Send Message</button>
                </form>
            </article>
        </section>

        <aside>
            <h2>Contact Information</h2>
            <p>Email: acangeles@feudiliman.edu.ph</p>
            <p>Phone: +63 905 2626 683</p>
            <p>Social media: Ayla Condiman Angeles</p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Ayla Angeles. All rights reserved.</p>
    </footer>
</body>
</html>
